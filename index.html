<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VALFLIX - O streaming do Val</title>
  <link rel="stylesheet" href="style-intro.css">
</head>
<body>

  <main class="netflix-container">
    <header class="header">
      <h1>Escolha a versão do layout</h1>

<!-- Aqui necessita que se crie uma estilização no Css, \[<h2>] e \[<p>]que pode ser a msm, ou não, que tenha que alterar -->
      <h2>Selecione um dos Cards com o tipo de design que deseja para visualizar a demonstração do projeto</h2>
      <p>Você poderá voltar a qualquer hora a este menu com o botão voltar localizado em cada Design</p>
    </header>

    <div class="cards-grid">
 
      <!-- Card Layout 1 -->
      <a href="./normal_responsivo_layout_1/index.html" class="card">
        <div class="card-image-wrapper">
          <img src="assets/img_valfix_card_estiliz_normal_layout1.png" alt="Prévia Layout Normal Responsivo">
        </div>
        <div class="card-title">Versão Normal Responsivo</div>
      </a>

      <!-- Card Layout 2 -->
      <a href="./menu_sanduiche_layout_2/index.html" class="card">
        <div class="card-image-wrapper">
    	  <img src="assets/img_valflix_card_sanduiche_layout2.jpg" alt="Prévia Layout Menu Sanduiche">
        </div>
        <div class="card-title">Versão Menu Sanduiche</div>
      </a>

      <!-- Card Layout 3 -->
      <a href="./design_moderno_layout_3/index.html" class="card">
         <div class="card-image-wrapper">
            <img src="assets/img_valfix_card_design_moderno_layout3.png" alt="Prévia Layout Moderno">
         </div>
         <div class="card-title">Versão Moderna</div>
      </a>

    </div>
  </main>

</body>
</html>
